version: 2

models:
  - name: obt
    description: "One Big Table (OBT) denormalized analytical dataset joining silver bookings, listings, and hosts for reporting and ad-hoc BI."
    columns:
      - name: BOOKING_ID
        description: "Unique booking identifier (Primary Key of OBT)."
        data_tests:
          - unique
          - not_null
      - name: LISTING_ID
        description: "Foreign key to the listing."
        data_tests:
          - not_null
      - name: HOST_ID
        description: "Foreign key to the host."
        data_tests:
          - not_null
      - name: TOTAL_AMOUNT
        data_tests:
          - not_null
      - name: BOOKING_STATUS
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['confirmed', 'cancelled']
      - name: PRICE_PER_NIGHT
        data_tests:
          - not_null
      - name: PRICE_PER_NIGHT_TAG
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LOW', 'MEDIUM', 'HIGH']
      - name: RESPONSE_RATE_BAND
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VERY GOOD', 'GOOD', 'AVERAGE', 'POOR']
