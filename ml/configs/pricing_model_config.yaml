model_name: "price_regressor"
version: "1.0.0"
target_column: "PRICE_PER_NIGHT"

features:
  numeric:
    - "ACCOMMODATES"
    - "BEDROOMS"
    - "BATHROOMS"
    - "bedroom_to_accommodates_ratio"
    - "cleaning_fee_per_bedroom"
    - "cleaning_fee_per_accommodate"
    - "arrival_month"
    - "arrival_dow"
    - "is_weekend_arrival"
    - "arrival_quarter"
    - "arrival_month_sin"
    - "arrival_month_cos"
    - "arrival_dow_sin"
    - "arrival_dow_cos"
    - "host_response_rate"
    - "CLEANING_FEE"
    - "is_superhost_binary"
  categorical:
    - "PROPERTY_TYPE"
    - "ROOM_TYPE"
    - "CITY"
    - "RESPONSE_RATE_BAND"

hyperparameters:
  n_estimators: 150
  max_depth: 5
  learning_rate: 0.05
  random_state: 42
